<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Apple Standalone App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ραδιάκι μας">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <meta name="theme-color" content="#000000">

    <title>Το Ραδιάκι μας</title>

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --card-active: #2c2c2e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --error-color: #ff453a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 16px 120px 16px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .station-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .station-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.15s ease;
            border: 1px solid transparent;
        }

        .station-card:active {
            transform: scale(0.98);
            background-color: var(--card-active);
        }

        .station-card.active {
            border-color: var(--accent-color);
        }

        .station-info h2 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .station-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .player-bar {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .now-playing-title {
            font-size: 16px;
            font-weight: 600;
        }

        .now-playing-sub {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .now-playing-sub.error {
            color: var(--error-color);
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Το Ραδιάκι μας</h1>
        <p>της οικογένειας Μπακόλα · χωρίς διαφημίσεις ♥</p>
    </header>

    <div class="station-list" id="stationList"></div>

    <div class="player-bar" id="playerBar">
        <div>
            <div class="now-playing-title" id="currentStationName">Station</div>
            <div class="now-playing-sub" id="statusText">Ζωντανά</div>
        </div>
        <button onclick="togglePlay()" id="playPauseBtn" class="control-btn">⏸</button>
    </div>

    <audio id="audioPlayer" preload="none"></audio>

    <script>
        // ============================================================
        //  STATIONS — the only part you ever need to edit.
        //  Every URL MUST start with https:// (GitHub Pages is https,
        //  and browsers silently block http:// audio on https pages).
        // ============================================================
        const STATIONS = [
            {
                name: 'Δεύτερο Πρόγραμμα',
                sub: '103.7 FM — ERT Live',
                url: 'https://radiostreaming.ert.gr/ert-deftero'
            },
            {
                name: 'Μελωδία FM',
                sub: '99.2 FM — Athens',
                url: 'https://stream.radiojar.com/melodia992'
            },
            {
                name: 'Ερωτικός FM',
                sub: '94.8 FM — Thessaloniki',
                // Official HTTPS stream, taken from eroticos.gr's own player
                url: 'https://eu1.fastcast4u.com/proxy/nmarog01?mp=/1'
            },
            {
                name: 'Σοχός FM',
                sub: '88.7 FM — Thessaloniki',
                // Official HTTPS stream, taken from sohosfm.gr's own player
                url: 'https://solid55.streamupsolutions.com/proxy/zskzsrci?mp=/1'
            }
        ];

        const player = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('playerBar');
        const stationNameLabel = document.getElementById('currentStationName');
        const statusText = document.getElementById('statusText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const list = document.getElementById('stationList');

        let current = null;

        // Build the cards from the list above
        STATIONS.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML =
                '<div class="station-info"><h2>' + s.name + '</h2><p>' + s.sub + '</p></div>' +
                '<div class="play-btn">▶</div>';
            card.onclick = () => playStation(i);
            list.appendChild(card);
        });

        function setStatus(text, isError) {
            statusText.innerText = text;
            statusText.classList.toggle('error', !!isError);
        }

        function highlight(i) {
            document.querySelectorAll('.station-card').forEach((c, idx) => {
                c.classList.toggle('active', idx === i);
            });
        }

        function playStation(i) {
            const s = STATIONS[i];
            current = i;
            stationNameLabel.innerText = s.name;
            playerBar.style.display = 'flex';
            highlight(i);

            if (!s.url.startsWith('https://')) {
                setStatus('Λείπει το https link', true);
                playPauseBtn.innerText = '▶';
                return;
            }

            setStatus('Σύνδεση...');
            // Add a cache-buster so a live stream always starts "now"
            player.src = s.url + (s.url.includes('?') ? '&' : '?') + '_t=' + Date.now();
            player.play().catch(() => {
                setStatus('Πάτα ▶ ξανά', true);
                playPauseBtn.innerText = '▶';
            });
        }

        // Status follows what the audio REALLY does, not what we hope
        player.addEventListener('playing', () => {
            setStatus('Ζωντανά');
            playPauseBtn.innerText = '⏸';
        });
        player.addEventListener('waiting', () => setStatus('Φόρτωση...'));
        player.addEventListener('error', () => {
            if (current === null) return;
            setStatus('Ο σταθμός δεν απαντά', true);
            playPauseBtn.innerText = '▶';
        });

        function togglePlay() {
            if (current === null) return;
            if (player.paused) {
                // Reconnect to the live point instead of resuming old buffer
                playStation(current);
            } else {
                player.pause();
                playPauseBtn.innerText = '▶';
                setStatus('Σε παύση');
            }
        }
    </script>
</body>
</html>
