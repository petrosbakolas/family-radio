<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Apple Standalone App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Family Radio">
    
    <title>Family Radio</title>
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --card-active: #2c2c2e;
            --accent-color: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 16px 120px 16px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .station-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }

        .station-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }

        .station-card:active {
            transform: scale(0.98);
            background-color: var(--card-active);
        }

        .station-info h2 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .station-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        /* Fixed Bottom Mini Player */
        .player-bar {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .now-playing-title {
            font-size: 16px;
            font-weight: 600;
        }

        .now-playing-sub {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Family Radio</h1>
        <p>Direct Ad-Free Online Streams</p>
    </header>

    <div class="station-list">
        <div class="station-card" onclick="playStation('Δεύτερο Πρόγραμμα 103.7', 'https://radiostreaming.ert.gr/ert-deftero')">
            <div class="station-info">
                <h2>Δεύτερο Πρόγραμμα</h2>
                <p>103.7 FM — ERT Live</p>
            </div>
            <div class="play-btn">▶</div>
        </div>

        <div class="station-card" onclick="playStation('Μελωδία FM 99.2', 'https://stream.radiojar.com/melodia992')">
            <div class="station-info">
                <h2>Μελωδία FM</h2>
                <p>99.2 FM — Athens</p>
            </div>
            <div class="play-btn">▶</div>
        </div>

        <div class="station-card" onclick="playStation('Ερωτικός FM 94.8', 'http://eu1.fastcast4u.com:21624/stream')">
            <div class="station-info">
                <h2>Ερωτικός FM</h2>
                <p>94.8 FM — Thessaloniki</p>
            </div>
            <div class="play-btn">▶</div>
        </div>

        <div class="station-card" onclick="playStation('Σοχός FM 88.7', 'http://212.95.45.82:32032/stream')">
            <div class="station-info">
                <h2>Σοχός FM</h2>
                <p>88.7 FM — Thessaloniki</p>
            </div>
            <div class="play-btn">▶</div>
        </div>
    </div>

    <!-- Live Audio Player Bar -->
    <div class="player-bar" id="playerBar" style="display:none;">
        <div>
            <div class="now-playing-title" id="currentStationName">Station</div>
            <div class="now-playing-sub" id="statusText">Playing Live</div>
        </div>
        <button onclick="togglePlay()" id="playPauseBtn" class="control-btn">⏸</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const player = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('playerBar');
        const stationNameLabel = document.getElementById('currentStationName');
        const statusText = document.getElementById('statusText');
        const playPauseBtn = document.getElementById('playPauseBtn');

        function playStation(name, url) {
            stationNameLabel.innerText = name;
            statusText.innerText = 'Connecting...';
            playerBar.style.display = 'flex';
            
            // Try direct stream first; if non-SSL, route through allorigins stream wrapper
            let targetUrl = url;
            if (window.location.protocol === 'https:' && url.startsWith('http:')) {
                targetUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            }

            player.src = targetUrl;
            player.play().then(() => {
                statusText.innerText = 'Playing Live';
                playPauseBtn.innerText = '⏸';
            }).catch((err) => {
                console.error("Direct play blocked, attempting secondary route...", err);
                player.src = 'https://cors-anywhere.herokuapp.com/' + url;
                player.play().then(() => {
                    statusText.innerText = 'Playing Live';
                    playPauseBtn.innerText = '⏸';
                }).catch(() => {
                    statusText.innerText = 'Tap play to retry';
                    playPauseBtn.innerText = '▶';
                });
            });
        }

        function togglePlay() {
            if (player.paused) {
                player.play();
                playPauseBtn.innerText = '⏸';
                statusText.innerText = 'Playing Live';
            } else {
                player.pause();
                playPauseBtn.innerText = '▶';
                statusText.innerText = 'Paused';
            }
        }
    </script>
</body>
</html>
